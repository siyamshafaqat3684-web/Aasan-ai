<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aasan AI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- SCREEN 1: WELCOME -->
<div class="screen active" id="screen-welcome">
  <div class="welcome-box">
    <h1>Welcome</h1>
    <h2>to</h2>
    <h1 class="brand">Aasan AI</h1>
    <p class="dev-credit">Developer by<br><strong>Saim Shafaqat</strong></p>
    <button id="getStartedBtn">Get Started</button>
  </div>
</div>

<!-- SCREEN 2: MAIN CHAT -->
<div class="screen" id="screen-chat">
  <header>
    <button class="icon-btn" id="menuBtn">☰</button>
    <span class="header-title">Aasan AI</span>
    <button class="icon-btn" id="historyBtn">🕑</button>
  </header>

  <div class="chat" id="chatArea">
    <div class="msg bot">Welcome to Aasan AI! Camera ya gallery se document ki tasveer bhejein, ya type/bol kar poochein.</div>
  </div>

  <div class="preview-bar" id="previewBar">
    <img id="previewImg" src="">
    <span>Document ready</span>
    <button id="clearAttach">✕</button>
  </div>

  <div class="inputbar">
    <div class="attach-menu">
      <button class="icon-btn" id="plusBtn">+</button>
      <div class="attach-pop" id="attachPop">
        <button id="cameraOpt">📷 Camera</button>
        <button id="galleryOpt">🖼️ Gallery</button>
      </div>
    </div>
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">
    <input type="file" id="galleryInput" accept="image/*" style="display:none;">
    <button class="icon-btn" id="micBtn">🎤</button>
    <input id="textInput" placeholder="Type a message...">
    <button class="icon-btn send-btn" id="sendBtn">➤</button>
  </div>
</div>

<!-- SCREEN 3: SETTINGS -->
<div class="screen" id="screen-settings">
  <header>
    <button class="icon-btn" id="settingsBackBtn">←</button>
    <span class="header-title">Settings</span>
    <span style="width:38px;"></span>
  </header>
  <div class="settings-list">
    <div class="setting-row">
      <span>Language</span>
      <select id="langSelect">
        <option value="auto">Auto (default)</option>
        <option value="ur">Urdu</option>
        <option value="en">English</option>
        <option value="es">Spanish</option>
      </select>
    </div>
    <div class="setting-row">
      <span>Voice replies</span>
      <input type="checkbox" id="voiceToggle" checked>
    </div>
    <div class="setting-row">
      <span>Text size</span>
      <select id="textSizeSelect">
        <option value="normal">Normal</option>
        <option value="large">Large</option>
      </select>
    </div>
    <button class="setting-action danger" id="clearHistoryBtn">Clear All History</button>
    <div class="about-box">
      <p>Aasan AI</p>
      <p class="dev-credit">Developer by <strong>Saim Shafaqat</strong></p>
    </div>
  </div>
</div>

<!-- SCREEN 4: HISTORY -->
<div class="screen" id="screen-history">
  <header>
    <button class="icon-btn" id="historyBackBtn">←</button>
    <span class="header-title">History</span>
    <span style="width:38px;"></span>
  </header>
  <div class="history-list" id="historyList"></div>
</div>

<script src="script.js"></script>
</body>
  </html>
